<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">MapAgent: evidence-bounded localisation</title><desc id="desc">BLE, motion and supplied map inputs form registered candidates for Qwen3. An independent verifier accepts a supported candidate or returns a deterministic fallback.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#213446} .title{font-size:35px;font-weight:700}.sub{font-size:21px;fill:#536879}.head{font-size:26px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#536879}.label{font-size:20px;font-weight:700;letter-spacing:2px;fill:#356b9a}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#94a8b8" stroke-width="1.6"/></marker></defs><rect width="1440" height="860" fill="#fff"/><text x="50" y="62" class="title" text-anchor="start">MapAgent</text><text x="50" y="103" class="sub" text-anchor="start">Evidence-bounded position selection with an independent verifier</text><text x="50" y="165" class="label" text-anchor="start">SUPPLIED EVIDENCE</text><rect x="50" y="200" width="255" height="120" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="74" y="239" class="head" text-anchor="start">BLE</text><text x="74" y="277" class="body" text-anchor="start">Radio observations</text><rect x="50" y="355" width="255" height="120" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="74" y="394" class="head" text-anchor="start">Motion</text><text x="74" y="432" class="body" text-anchor="start">Movement context</text><rect x="50" y="510" width="255" height="140" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="74" y="549" class="head" text-anchor="start">Map + anchors</text><text x="74" y="587" class="body" text-anchor="start">Given geometry</text><text x="74" y="617" class="body" text-anchor="start">Walkable routes</text><path d="M307 260 H326 V414 H351" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M307 415 H351" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M307 580 H326 V416 H351" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="365" y="335" width="230" height="165" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="389" y="374" class="head" text-anchor="start">Candidates</text><text x="389" y="412" class="body" text-anchor="start">Bounded set</text><text x="389" y="442" class="body" text-anchor="start">Registered IDs</text><text x="389" y="472" class="body" text-anchor="start">Evidence packet</text><path d="M598 417 H635" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="650" y="335" width="200" height="165" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="674" y="374" class="head" text-anchor="start">Qwen3</text><text x="674" y="412" class="body" text-anchor="start">Select / abstain</text><text x="674" y="442" class="body" text-anchor="start">Cite evidence</text><path d="M853 417 H890" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="905" y="335" width="220" height="165" rx="15" fill="#edf6f5" stroke="#ced9e2" stroke-width="2"/><text x="929" y="374" class="head" text-anchor="start">Verification</text><text x="929" y="412" class="body" text-anchor="start">Valid candidate</text><text x="929" y="442" class="body" text-anchor="start">Valid evidence</text><text x="929" y="472" class="body" text-anchor="start">Map constraints</text><text x="1160" y="338" class="label" text-anchor="start">PASS</text><path d="M1128 386 H1180" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="1195" y="345" width="195" height="105" rx="15" fill="#edf6f5" stroke="#ced9e2" stroke-width="2"/><text x="1219" y="384" class="head" text-anchor="start">Accept</text><text x="1219" y="422" class="body" text-anchor="start">Position</text><path d="M1015 503 V610 H1179" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><text x="1040" y="584" class="small" text-anchor="start">FAIL / ABSTAIN</text><rect x="1195" y="548" width="195" height="125" rx="15" fill="#fcf7ee" stroke="#ced9e2" stroke-width="2"/><text x="1219" y="587" class="head" text-anchor="start">Fallback</text><text x="1219" y="625" class="body" text-anchor="start">Deterministic</text><text x="1219" y="655" class="body" text-anchor="start">candidate</text><rect x="50" y="730" width="1340" height="85" rx="15" fill="#f6f8fa" stroke="#ced9e2" stroke-width="2"/><text x="75" y="767" class="body" text-anchor="start">Geometric validity and localisation accuracy are evaluated separately.</text><text x="75" y="799" class="small" text-anchor="start">This workflow uses supplied maps and anchor layouts; it does not imply automatic floor-plan reconstruction.</text></svg>