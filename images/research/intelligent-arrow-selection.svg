<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Intelligent arrow selection: study workflow</title><desc id="desc">Physical measurements, high-speed video and SAM-based target analysis support an experimental study. The YOLO11s engineering companion is shown separately.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#213446} .title{font-size:35px;font-weight:700}.sub{font-size:21px;fill:#536879}.head{font-size:26px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#536879}.label{font-size:20px;font-weight:700;letter-spacing:2px;fill:#356b9a}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#94a8b8" stroke-width="1.6"/></marker></defs><rect width="1440" height="860" fill="#fff"/><text x="50" y="62" class="title" text-anchor="start">Intelligent arrow selection</text><text x="50" y="103" class="sub" text-anchor="start">Measurement, kinematics and visual evidence</text><text x="50" y="160" class="label" text-anchor="start">RESEARCH ANALYSIS</text><rect x="50" y="190" width="410" height="140" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="74" y="229" class="head" text-anchor="start">Arrow measurements</text><text x="74" y="267" class="body" text-anchor="start">Arrow IDs and properties</text><text x="74" y="297" class="body" text-anchor="start">Shooting-round records</text><path d="M255 333 V388" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="515" y="190" width="410" height="140" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="539" y="229" class="head" text-anchor="start">High-speed video</text><text x="539" y="267" class="body" text-anchor="start">Launch velocity and angle</text><text x="539" y="297" class="body" text-anchor="start">Shot-level kinematics</text><path d="M720 333 