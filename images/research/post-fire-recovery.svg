<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">Post-fire vegetation recovery: study design</title><desc id="desc">Equal six-year windows around the Gospers Mountain fire compare modelled soil-water saturation with MODIS NDVI. Long-term trend concordance is separated from year-to-year changes.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#213446} .title{font-size:35px;font-weight:700}.sub{font-size:21px;fill:#536879}.head{font-size:26px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#536879}.label{font-size:20px;font-weight:700;letter-spacing:2px;fill:#356b9a}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#94a8b8" stroke-width="1.6"/></marker></defs><rect width="1440" height="860" fill="#fff"/><text x="50" y="62" class="title" text-anchor="start">Hydrological constraints on post-fire recovery</text><text x="50" y="103" class="sub" text-anchor="start">Gospers Mountain megafire as a natural experiment</text><text x="50" y="159" class="label" text-anchor="start">MATCHED OBSERVATION WINDOWS</text><rect x="50" y="190" width="455" height="130" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="74" y="229" class="head" text-anchor="start">Before the fire</text><text x="74" y="267" class="body" text-anchor="start">Six-year observation window</text><rect x="545" y="190" width="350" height="130" rx="15" fill="#fcf7ee" stroke="#ced9e2" stroke-width="2"/><text x="569" y="229" class="head" text-anchor="start">Disturbance</text><text x="569" y="267" class="body" text-anchor="start">2019–2020 megafire</text><rect x="935" y="190" width="455" height="130" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="959" y="229" class="head" text-anchor="start">Recovery</text><text x="959" y="267" class="body" text-anchor="start">2020–2025 · six years</text><line x1="50" y1="359" x2="1390" y2="359" stroke="#ced9e2" stroke-width="2"/><text x="50" y="407" class="label" text-anchor="start">PAIRED ENVIRONMENTAL DATA</text><rect x="50" y="440" width="640" height="108" rx="15" fill="#edf6f5" stroke="#ced9e2" stroke-width="2"/><text x="74" y="479" class="head" text-anchor="start">Modelled soil-water saturation</text><rect x="750" y="440" width="640" height="108" rx="15" fill="#edf6f5" stroke="#ced9e2" stroke-width="2"/><text x="774" y="479" class="head" text-anchor="start">Satellite-derived MODIS NDVI</text><path d="M370 551 V581 H720 V610" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M1070 551 V581 H720" fill="none" stroke="#94a8b8" stroke-width="2.7"/><rect x="50" y="640" width="640" height="135" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="74" y="679" class="head" text-anchor="start">Long-term trends</text><text x="74" y="717" class="body" text-anchor="start">Compare soil-water and NDVI trend directions</text><text x="74" y="747" class="body" text-anchor="start">Quantify positive trend concordance</text><rect x="750" y="640" width="640" height="135" rx="15" fill="#f2f6fa" stroke="#ced9e2" stroke-width="2"/><text x="774" y="679" class="head" text-anchor="start">Year-to-year changes</text><text x="774" y="717" class="body" text-anchor="start">Analyse annual variation separately</text><text x="774" y="747" class="body" text-anchor="start">Assess short-term coupling</text><path d="M720 611 H370 V637" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><path d="M720 611 H1070 V637" fill="none" stroke="#94a8b8" stroke-width="2.7" marker-end="url(#arrow)"/><text x="50" y="827" class="small" text-anchor="start">Study design only. Trend concordance is neither a recovery rate nor a causal effect.</text></svg>